<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F5F7">
<title>Menu</title>
<!--
  RESTRO's QR links until the domain is decided (owner, 14 Nov 2026). A QR from QR Studio holds
  https://sandeepdonavalli-droid.github.io/restro/<restaurant>/<T7 | TK | MN>-<code>, an event's <restaurant>/EV-<code>
  and an event table's <restaurant>/E3-<code>; GitHub Pages has no page there, so it serves this one, which reads the
  link and shows the customer the restaurant's menu in its menu design, with everything on it working: the dish page,
  the Menu list, search, the cart, checkout, the payment step and Order placed (Update Pack 7: customer-menu.js,
  customer-pages.js).
  Where the menu, the design and what's sold out come from: customer-data.js. Until the cloud is connected, only a
  browser where RESTRO itself runs for that restaurant has them (the tablet's); anywhere else, and while no menu design
  is picked, the page says "Our menu is coming soon. Please ask staff." (B3). Nothing is sent anywhere: orders don't
  reach the restaurant and no money is taken until the cloud and a payment provider are connected (owner, 18 Nov 2026).
-->
<style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:#F4F5F7}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0F1626;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
/* (B3: no menu yet; the pack's neutral page, the restaurant's name in capitals) */
.soon{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 36px max(24px,env(safe-area-inset-bottom));text-align:center}
.soon b{max-width:100%;font-size:19px;font-weight:700;line-height:23px;overflow-wrap:anywhere}
.soon h1{max-width:288px;margin-top:31px;font-size:24.3px;font-weight:700;line-height:30px}
.soon p{margin-top:13px;color:#4B5461;font-size:15.5px;line-height:21px}
.missing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.missing b{font-size:22px;font-weight:700}
.missing span{margin-top:8px;font-size:16px;color:#4B5461}
/* (the menu and its pages: the page fills the phone's screen) */
body.menu{background:var(--page-bg,#F4F5F7)}
</style>
</head>
<body>
<div id="page" aria-live="polite"></div>
<script>
'use strict';
(() => {
  // The site's own folder: /restro/ on GitHub Pages ("/" anywhere else), for RESTRO's files
  const base = location.pathname.startsWith('/restro/') ? '/restro/' : '/';
  const font = document.createElement('style');
  font.textContent = `@font-face{font-family:Inter;font-style:normal;font-weight:100 900;font-display:swap;src:url(${base}assets/fonts/inter-latin-wght-normal.woff2) format('woff2')}`;
  document.head.append(font);
  const page = document.getElementById('page');
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const theme = colour => document.querySelector('meta[name="theme-color"]').setAttribute('content', colour);
  // <restaurant>/<T7 | TK | MN | EV | E3>-<code>: the restaurant's name in small letters with "-" between words, a
  // table's or an event table's name (letters and numbers), and the QR's 6-character code
  let path = '';
  try { path = decodeURIComponent(location.pathname.slice(base.length)).replace(/\/+$/, ''); } catch {}
  const m = /^([a-z0-9]+(?:-[a-z0-9]+)*)\/(?:(TK|MN|EV)|T([A-Za-z0-9]{1,12})|E([A-Za-z0-9]{1,12}))-([A-Z0-9]{6})$/.exec(path);
  if (!m) {
    document.title = 'Page not found';
    const box = el('div', 'missing'); box.append(el('b', null, 'Page not found'), el('span', null, 'Check the link and try again.'));
    page.append(box);
    return;
  }
  const [, slug, kindCode, table, eventTable, code] = m;
  const link = { slug, kind: kindCode === 'TK' ? 'takeaway' : kindCode === 'MN' ? 'menu' : kindCode === 'EV' || eventTable ? 'event' : 'table', table, eventTable, code };
  const nameFromLink = slug.split('-').join(' ').toUpperCase();
  document.title = nameFromLink;

  // B3's neutral page, until there is a menu to show
  function soon(name) {
    document.body.classList.remove('menu'); theme('#F4F5F7'); document.title = name;
    const box = el('main', 'soon');
    box.append(el('b', null, name), el('h1', null, 'Our menu is coming soon.'), el('p', null, 'Please ask staff.'));
    page.replaceChildren(box);
  }
  // The menu and its pages, in the restaurant's design; again whenever the restaurant changes it
  let shown = null, last = '';
  function show() {
    const data = window.RestroCustomerData?.read(link), sig = JSON.stringify(data);
    if (shown && sig === last) return;
    last = sig;
    if (!data || !data.template) { shown?.destroy(); shown = null; soon(data?.restaurant || nameFromLink); return; }
    document.title = data.restaurant;
    if (shown) { shown.update(data); } else {
      page.replaceChildren(); document.body.classList.add('menu');
      shown = window.RestroCustomerPages.mount(page, { ...data, full: true, history: true, hint: true });
    }
    const bg = getComputedStyle(shown.root).backgroundColor;
    document.body.style.setProperty('--page-bg', bg); theme(bg);
  }

  // RESTRO's files, in order: the menu, the restaurant's settings, the bill's sums and the receipt (the same as the POS
  // prints: receipt.js), the tables' names, the customer's menu and pages, where the data comes from
  for (const href of ['customer-menu.css?v=1', 'customer-pages.css?v=1']) {
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = base + href; document.head.append(css);
  }
  const files = ['menu-data.js?v=6', 'prefs.js?v=12', 'bill.js?v=4', 'receipt.js?v=1', 'floor-data.js?v=1', 'customer-menu.js?v=1', 'customer-pages.js?v=1', 'customer-data.js?v=1'];
  let left = files.length;
  for (const src of files) {
    const js = document.createElement('script'); js.src = base + src; js.async = false; js.charset = 'utf-8';
    // (again each minute too: opening and closing times, an event's start and end, come by themselves)
    js.onload = () => { if (--left === 0) { show(); window.RestroCustomerData.watch(show); setInterval(show, 60000); } };
    js.onerror = () => soon(nameFromLink);
    document.head.append(js);
  }
})();
</script>
</body>
</html>
